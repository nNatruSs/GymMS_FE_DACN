

<div class="mode-header mb-4 d-flex align-items-center">
  <button
    class="back-btn me-3"
    type="button"
    (click)="back.emit()"
    aria-label="Go back"
  >
    <i class="bi bi-arrow-left"></i>
  </button>
  <h5 class="fw-semibold mb-0">
    {{ branch.name }} — Choose your class type preference!
  </h5>
</div>

<div class="mode-grid">
  
  <div
    data-testid="booking-mode-class"
    class="mode-card class"
    [class.disabled]="disabled"
    (click)="choose('class')">
    <div class="overlay">
      <h2>Classes</h2>
      <p>Group sessions</p>
    </div>
  </div>

  
  <div
    data-testid="booking-mode-trainer"
    class="mode-card trainer"
    [class.disabled]="disabled"
    (click)="choose('trainer')">
    <div class="overlay">
      <h2>Trainers</h2>
      <p>1-on-1 coaching</p>
    </div>
  </div>
</div>

<div *ngIf="disabled" class="text-danger mt-3">
  Membership required to continue.
</div>
